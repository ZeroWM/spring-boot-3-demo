services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: spring_boot_3_db
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: .
    image: spring-boot-3-demo:local
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/spring_boot_3_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8"
      SPRING_DATASOURCE_USERNAME: mysql
      SPRING_DATASOURCE_PASSWORD: mysql
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
